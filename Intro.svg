<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url("https://fonts.googleapis.com/css?family=Raleway:400,400i,700");

        *, *::before, *::after {
            padding: 0;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .content {
          font-family: Raleway, sans-serif;
          background-color: transparent;
          color: #fff;
          font-size: 24px;
          width: 100%;
          max-width: 100%;
          padding: 1.5em 1em;
          text-align: center;
        }

        .marquee {
          position: relative;
          width: 100%;
          height: 2em;
          font-size: 4.5em;
          display: grid;
          place-items: center;
          overflow: hidden;
        }

        .marquee_text {
          position: absolute;
          min-width: 100%;
          white-space: nowrap;
          animation: marquee 16s infinite linear;
        }

        @keyframes marquee {
          from { translate: 70%; }
          to { translate: -70%; }
        }

        .marquee_blur {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
          background-color: #0d1117;
          background-image:
            linear-gradient(to right, white, 1rem, transparent 50%),
            linear-gradient(to left, white, 1rem, transparent 50%);
          filter: contrast(15);
        }

        .marquee_blur p {
          filter: blur(0.07em);
        }

        .marquee_clear {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
        }
      </style>

      <div class="content">
        <div class="marquee">
          <div class="marquee_blur" aria-hidden="true">
            <p class="marquee_text">Kyrillos Wahid</p>
          </div>
          <div class="marquee_clear">
            <p class="marquee_text">Kyrillos Wahid</p>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
